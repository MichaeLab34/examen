services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decrochage}
      POSTGRES_USER: ${POSTGRES_USER:-decrochage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decrochage} -d ${POSTGRES_DB:-decrochage}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DECROCHAGE_MODEL_PATH: /app/artifacts/models/model_bundle.joblib
      DECROCHAGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-decrochage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-decrochage}
      DECROCHAGE_PSEUDONYMIZATION_SECRET: ${DECROCHAGE_PSEUDONYMIZATION_SECRET:?DECROCHAGE_PSEUDONYMIZATION_SECRET is required}
      DECROCHAGE_RETENTION_DAYS: ${DECROCHAGE_RETENTION_DAYS:-365}
      DECROCHAGE_API_KEY: ${DECROCHAGE_API_KEY:-}
      DECROCHAGE_RATE_LIMIT_PER_MINUTE: ${DECROCHAGE_RATE_LIMIT_PER_MINUTE:-60}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:////app/artifacts/mlflow.db}
      MLFLOW_ARTIFACT_ROOT: /app/artifacts/mlflow-artifacts
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-decrochage-l1-training}
      DECROCHAGE_REGISTERED_MODEL: ${DECROCHAGE_REGISTERED_MODEL:-}
      DECROCHAGE_MODEL_ALIAS: ${DECROCHAGE_MODEL_ALIAS:-production}
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    build: .
    profiles: ["run"]
    command: ["decrochage", "schedule"]
    environment:
      DECROCHAGE_REFERENCE_CSV: /app/data/raw/decrochage_etudiants_complet_V5.csv
      DECROCHAGE_CURRENT_CSV: /app/data/raw/decrochage_etudiants_echantillon_V5.csv
      DECROCHAGE_STUDENTS_CSV: /app/data/raw/decrochage_etudiants_complet_V5.csv
      DECROCHAGE_CATALOGUE_CSV: /app/data/raw/catalogue_formations_V5.csv
      DECROCHAGE_DRIFT_REPORT_PATH: /app/reports/drift_report.json
      DECROCHAGE_MODEL_PATH: /app/artifacts/models/model_bundle.joblib
      DECROCHAGE_SCHEDULER_STATE: /app/artifacts/scheduler/state.json
      DECROCHAGE_TRAINED_ON: ${DECROCHAGE_TRAINED_ON:-2024-09-01}
      DECROCHAGE_LABELS_AVAILABLE: ${DECROCHAGE_LABELS_AVAILABLE:-false}
      DECROCHAGE_PERFORMANCE_ALERT: ${DECROCHAGE_PERFORMANCE_ALERT:-false}
      DECROCHAGE_MONITOR_CRON: ${DECROCHAGE_MONITOR_CRON:-0 6 * * 1}
      DECROCHAGE_RETRAIN_CRON: ${DECROCHAGE_RETRAIN_CRON:-0 7 * * 1}
      DECROCHAGE_SCHEDULER_TIMEZONE: ${DECROCHAGE_SCHEDULER_TIMEZONE:-Europe/Paris}
      DECROCHAGE_HEALTHCHECK_URL: ${DECROCHAGE_HEALTHCHECK_URL:-}
      DECROCHAGE_ALERT_WEBHOOK_URL: ${DECROCHAGE_ALERT_WEBHOOK_URL:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:////app/artifacts/mlflow.db}
      MLFLOW_ARTIFACT_ROOT: /app/artifacts/mlflow-artifacts
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-decrochage-l1-training}
      DECROCHAGE_REGISTERED_MODEL: ${DECROCHAGE_REGISTERED_MODEL:-decrochage-l1}
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data:ro
      - ./reports:/app/reports
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["run"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DECROCHAGE_DOMAIN: ${DECROCHAGE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["run"]
    depends_on:
      api:
        condition: service_healthy
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["run"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      DECROCHAGE_ALERT_WEBHOOK_URL: ${DECROCHAGE_ALERT_WEBHOOK_URL:-http://localhost:9999/alert-placeholder}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  grafana_data:
