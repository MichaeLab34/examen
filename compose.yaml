services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decrochage}
      POSTGRES_USER: ${POSTGRES_USER:-decrochage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decrochage} -d ${POSTGRES_DB:-decrochage}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DECROCHAGE_MODEL_PATH: /app/artifacts/models/model_bundle.joblib
      DECROCHAGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-decrochage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-decrochage}
      DECROCHAGE_PSEUDONYMIZATION_SECRET: ${DECROCHAGE_PSEUDONYMIZATION_SECRET:?DECROCHAGE_PSEUDONYMIZATION_SECRET is required}
      DECROCHAGE_RETENTION_DAYS: ${DECROCHAGE_RETENTION_DAYS:-365}
      DECROCHAGE_API_KEY: ${DECROCHAGE_API_KEY:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:////app/artifacts/mlflow.db}
      DECROCHAGE_REGISTERED_MODEL: ${DECROCHAGE_REGISTERED_MODEL:-}
      DECROCHAGE_MODEL_ALIAS: ${DECROCHAGE_MODEL_ALIAS:-production}
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    profiles: ["run"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DECROCHAGE_DOMAIN: ${DECROCHAGE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["run"]
    depends_on:
      api:
        condition: service_healthy
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["run"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      DECROCHAGE_ALERT_WEBHOOK_URL: ${DECROCHAGE_ALERT_WEBHOOK_URL:-http://localhost:9999/alert-placeholder}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  grafana_data:
