[project]
name = "decrochage"
version = "0.1.0"
description = "IA de détection précoce du décrochage étudiant en L1 — cas d'usage de certification"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "shap>=0.46",
    "numba>=0.61",
    "llvmlite>=0.44",
    "xgboost>=2.1",
    "python-dateutil>=2.9",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[dependency-groups]
notebook = [
    "jupyter>=1.1",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]
dev = [
    "ruff>=0.6",
    "black>=24.8",
    "httpx>=0.27",
    "pytest>=8.3",
]

[project.scripts]
decrochage = "decrochage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decrochage"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]
