apiVersion: 1

groups:
  - orgId: 1
    name: decrochage-run
    folder: Decrochage
    interval: 1m
    rules:
      - uid: decrochage-api-down
        title: "API indisponible depuis 5 minutes"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: "up{job=\"decrochage-api\"}"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Le service de scoring ne répond plus."
          runbook_url: "docs/runbook.md#api-indisponible"

      - uid: decrochage-5xx-rate
        title: "Taux d'erreurs 5xx supérieur à 1 %"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: "(sum(rate(http_requests_total{status=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(http_requests_total[5m])), 1)"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.01] }
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Plus de 1 % des requêtes échouent depuis 5 minutes."
          runbook_url: "docs/runbook.md#erreurs-5xx"
